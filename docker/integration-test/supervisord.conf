[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── PostgreSQL ────────────────────────────────────────────────────────────────
[program:postgresql]
command=/usr/lib/postgresql/14/bin/postgres
  -D /var/lib/postgresql/14/main
  -c config_file=/etc/postgresql/14/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.err.log
; Give postgres time to start before Canvas tries to connect
startsecs=5

; ── Redis ─────────────────────────────────────────────────────────────────────
[program:redis]
command=redis-server /etc/redis/redis.conf --daemonize no --loglevel notice
user=redis
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err.log
startsecs=3

; ── Canvas (Rails / Puma) ─────────────────────────────────────────────────────
[program:canvas]
command=/bin/bash -c "cd /usr/src/app && bundle exec rails server -b 0.0.0.0 -p 3000"
user=docker
autostart=true
autorestart=true
priority=20
environment=
  HOME="/home/docker",
  GEM_HOME="/home/docker/.gem/3.4",
  PATH="/usr/src/app/bin:/home/docker/.gem/3.4/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  BUNDLE_APP_CONFIG="/home/docker/.bundle",
  RAILS_ENV="development",
  CANVAS_DATABASE_HOST="localhost",
  CANVAS_DATABASE_USERNAME="canvas",
  POSTGRES_PASSWORD="canvas",
  ENCRYPTION_KEY="integrationtestencryptionkey00000000000000000000000000000000000"
stdout_logfile=/var/log/supervisor/canvas.log
stderr_logfile=/var/log/supervisor/canvas.err.log
; Wait for postgres and redis to be up before starting Canvas
startretries=5
startsecs=10

; ── Delayed Jobs (optional background worker) ─────────────────────────────────
; Set autostart=true if your tests exercise background jobs.
[program:delayed_job]
command=/bin/bash -c "cd /usr/src/app && bundle exec script/delayed_job run"
user=docker
autostart=false
autorestart=true
priority=30
environment=
  HOME="/home/docker",
  GEM_HOME="/home/docker/.gem/3.4",
  PATH="/usr/src/app/bin:/home/docker/.gem/3.4/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  BUNDLE_APP_CONFIG="/home/docker/.bundle",
  RAILS_ENV="development",
  CANVAS_DATABASE_HOST="localhost",
  CANVAS_DATABASE_USERNAME="canvas",
  POSTGRES_PASSWORD="canvas",
  ENCRYPTION_KEY="integrationtestencryptionkey00000000000000000000000000000000000"
stdout_logfile=/var/log/supervisor/delayed_job.log
stderr_logfile=/var/log/supervisor/delayed_job.err.log
