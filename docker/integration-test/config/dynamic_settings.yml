# Minimal dynamic_settings for integration testing (no Consul needed).
development: &default
  config:
    canvas:
      canvas:
        online-meeting-url-regex: |-
          https:\/\/[\w-]+\.zoom\.us\/\d+(\?[\w\/\-=%]*)?
          https:\/\/meet\.google\.com\/[\w\/\-=%]+(\?[\w\/\-=%]*)?
      lti:
        internal_tool_domain_allowlist:
          - 'localhost'
      rich-content-service:
        app-host: 'http://localhost:3001'
      math-man:
        base_url: 'http://localhost'
        use_for_svg: 'false'
        use_for_mml: 'false'
  private:
    canvas:
      auditors.yml: |
        write_paths:
          - active_record
        read_path: active_record
